server.port=8080

spring.application.name=random-games-platform

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# OpenAPI Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Game Platform Config
game.platform.disconnect-timeout-seconds=30
game.platform.session-timeout-seconds=1800
game.platform.snake.tick-rate-ms=150
game.platform.snake.default-width=20
game.platform.snake.default-height=20
